:root{--bg:#0B0C0E;--surface:#14161A;--surface-2:#1A1D22;--ink:#EDEFF2;--ink-muted:#A4ABB5;--ink-faint:#717884;--border:#262A31;--accent:#E2B977;--accent-ink:#F2D6A6;--alert:#FF7B7B;
--sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
a{color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.lg{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:#FFFFFF;color:#14161A;border-radius:18px;padding:30px 28px 26px;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.card img{display:block;width:150px;height:auto;margin:0 auto 18px}
.card h1{font-size:1.15rem;text-align:center;margin:0 0 4px;letter-spacing:-.01em}
.card p.s{text-align:center;color:#5A616B;font-size:.85rem;margin:0 0 20px}
.card label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A616B;margin:0 0 6px}
.card input[type=password]{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:1.5px solid #D8DCE1;border-radius:10px;background:#F7F8F9;color:#14161A}
.card input[type=password]:focus{outline:none;border-color:#2566AE;background:#fff}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.85rem;color:#3F4650}
.card button{width:100%;font:inherit;font-weight:700;font-size:.95rem;padding:12px;border:0;border-radius:10px;background:#14284A;color:#fff;cursor:pointer}
.card button:hover{background:#1B3866}.card button[disabled]{opacity:.6;cursor:wait}
.err{min-height:1.3em;color:#C2302F;font-size:.84rem;text-align:center;margin-top:12px}
.foot{text-align:center;color:var(--ink-faint);font-size:.75rem;margin-top:18px}
</style></head><body>
